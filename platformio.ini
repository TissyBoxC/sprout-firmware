[platformio]
build_dir = bgen

[env]
platform = espressif32
board = esp32-s3-n16r8
framework = espidf
monitor_speed = 115200
# Keep ESP-IDF ldgen below the Windows cmd.exe command-line limit.
extra_scripts =
    pre:tools/patch_platformio_ldgen.py
# JSON library used by the removable device_binding_client module. A profile
# that removes that module must remove this dependency with it.
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
# The OV2640 sensor driver is pulled in by components/camera_capture's
# idf_component.yml, not here: the driver's headers include the Registry decoder
# that the bundled framework lacks, and only the component manager resolves that
# dependency chain.
# ESP-IDF components do not inherit PlatformIO libdeps include paths, so the
# header-only ArduinoJson source directory is added explicitly.
build_flags =
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/ArduinoJson/src

[env:esp32-s3-n16r8]

# Production / release image. Layers sdkconfig.production.defaults on top of
# sdkconfig.defaults so the runtime security_posture gate and the bootloader
# both require Secure Boot and Flash Encryption. Signing and encryption keys
# are supplied by the release pipeline, never committed:
#   platformio run -e esp32-s3-n16r8-production
[env:esp32-s3-n16r8-production]
extra_scripts =
    pre:tools/patch_platformio_ldgen.py
    pre:tools/verify_production_signing.py
    pre:tools/prepare_production_secure_version.py
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.production.defaults"

[env:esp32-s3-n16r8-minimal]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.minimal.defaults"
