name: Firmware CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio==6.1.18 cryptography==46.0.7

      - name: Resolve ESP-IDF components
        run: pio run -e esp32-s3-n16r8 -t compiledb

      - name: Run host contract tests
        shell: pwsh
        run: ./tools/run_host_tests.ps1

      - name: Verify removable modules and generated-file policy
        shell: pwsh
        run: ./tools/verify_removable_modules.ps1

      - name: Verify module_registry capacity covers all registrations
        shell: pwsh
        run: ./tools/verify_module_registry_capacity.ps1

  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: platformio-production-${{ runner.os }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults', 'sdkconfig.production.defaults') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio==6.1.18

      - name: Generate throwaway Secure Boot signing key
        shell: bash
        run: |
          set -euo pipefail
          # CI never has the real manufacturing key; a throwaway key only lets
          # the hardened build and signing steps run end to end.
          openssl genrsa -out secure_boot_signing_key.pem 3072 2>/dev/null
          grep -q 'BEGIN' secure_boot_signing_key.pem

      - name: Build hardened production image
        env:
          SPROUT_SECURE_BOOT_SIGNING_KEY: ${{ github.workspace }}/secure_boot_signing_key.pem
          # Compile-only trust material. This is the RFC 8032 test public key
          # for seed 9d61...7f60 and is never used by a release build.
          SPROUT_OTA_TRUSTED_KEYS_JSON: '{"ci-test-only":"11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo="}'
        run: platformio run -e esp32-s3-n16r8-production

      - name: Verify generated production OTA hardening
        run: |
          python -m unittest discover -s test \
            -p 'test_secure_version_lifecycle.py' -v
          python -m unittest discover -s test \
            -p 'test_workflow_security_contract.py' -v
          python test/test_production_ota_config.py
          python tools/verify_secure_version_lifecycle.py \
            --root . \
            --generated-config sdkconfig.esp32-s3-n16r8-production

      - name: Assert signed production artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          build_dir="bgen/esp32-s3-n16r8-production"
          for artifact in firmware-signed.bin bootloader-signed.bin partitions-signed.bin; do
            test -s "$build_dir/$artifact"
          done
