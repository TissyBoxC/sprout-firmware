name: Release Firmware

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-firmware
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect version and existing release
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; skipping."
            exit 0
          fi
          {
            echo "should_release=true"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache PlatformIO
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: platformio-release-${{ runner.os }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}

      - name: Install PlatformIO
        if: steps.detect.outputs.should_release == 'true'
        run: python -m pip install --upgrade pip platformio==6.1.18

      - name: Build firmware
        if: steps.detect.outputs.should_release == 'true'
        run: platformio run -e esp32-s3-n16r8

      - name: Generate Chinese release notes
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_notes.py \
            --version "${{ steps.detect.outputs.version }}" \
            --current-tag "${{ steps.detect.outputs.tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-notes.md
          cat release-notes.md

      - name: Collect flashable release assets
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          build_dir="bgen/esp32-s3-n16r8"
          mkdir -p dist
          cp "$build_dir/firmware.bin" "dist/sprout-firmware-${{ steps.detect.outputs.tag }}.bin"
          cp "$build_dir/bootloader.bin" dist/bootloader.bin
          cp "$build_dir/partitions.bin" dist/partitions.bin
          cp "$build_dir/firmware.elf" dist/firmware.elf
          cp "$build_dir/sprout_firmware.map" dist/firmware.map
          (
            cd dist
            sha256sum * > SHA256SUMS
          )

      - name: Publish GitHub release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.detect.outputs.tag }}
          RELEASE_VERSION: ${{ steps.detect.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "初芽固件 $RELEASE_VERSION" \
            --notes-file release-notes.md
